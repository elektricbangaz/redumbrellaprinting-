name: Designer Typecheck Debug

on:
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designer-typecheck-log
          path: typecheck.log
