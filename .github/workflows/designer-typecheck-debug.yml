name: Designer Typecheck Debug

on:
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and typecheck
        id: diagnostic
        shell: bash
        run: |
          set +e
          npm ci --ignore-scripts > typecheck.log 2>&1
          code=$?
          if [ "$code" = "0" ]; then
            npx tsc --noEmit --pretty false >> typecheck.log 2>&1
            code=$?
          fi
          cat typecheck.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designer-typecheck-log
          path: typecheck.log
      - name: Fail on diagnostic error
        if: always()
        shell: bash
        run: |
          test "${{ steps.diagnostic.outputs.exit_code }}" = "0"
