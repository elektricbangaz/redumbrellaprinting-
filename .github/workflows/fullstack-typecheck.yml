name: Full-stack typecheck

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "middleware.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/redumbrella?schema=public
      AUTH_SECRET: ci-test-secret-only-not-for-production-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit --pretty false
