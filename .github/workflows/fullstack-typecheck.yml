name: Full-stack typecheck

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "middleware.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/fullstack-typecheck.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/redumbrella?schema=public
      AUTH_SECRET: ci-test-secret-only-not-for-production-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        continue-on-error: true
        run: npm ci --ignore-scripts > typecheck.log 2>&1
      - name: Prisma
        id: prisma
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx prisma generate >> typecheck.log 2>&1
      - name: Typecheck
        id: tsc
        if: steps.install.outcome == 'success' && steps.prisma.outcome == 'success'
        continue-on-error: true
        run: npx tsc --noEmit --pretty false >> typecheck.log 2>&1
      - name: Comment diagnostic
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL: ${{ steps.install.outcome }}
          PRISMA: ${{ steps.prisma.outcome }}
          TSC: ${{ steps.tsc.outcome }}
        with:
          script: |
            const fs=require('fs');
            const log=fs.existsSync('typecheck.log')?fs.readFileSync('typecheck.log','utf8'):'No log.';
            const body='### Full-stack typecheck diagnostic\n\nInstall: **'+process.env.INSTALL+'** · Prisma: **'+process.env.PRISMA+'** · TypeScript: **'+process.env.TSC+'**\n\n```text\n'+log.slice(-14000)+'\n```';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
      - name: Enforce
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.prisma.outcome }}" = "success"
          test "${{ steps.tsc.outcome }}" = "success"
