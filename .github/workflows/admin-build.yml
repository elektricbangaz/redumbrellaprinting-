name: Admin build

on:
  pull_request:
    paths:
      - "middleware.ts"
      - "auth.config.ts"
      - "auth.ts"
      - "app/admin/**"
      - "app/api/admin/**"
      - "components/admin/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-build.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/redumbrella?schema=public
      AUTH_SECRET: ci-test-secret-only-not-for-production-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        continue-on-error: true
        run: npm ci > build.log 2>&1
      - name: Prisma generate
        id: prisma
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx prisma generate >> build.log 2>&1
      - name: Next build
        id: nextbuild
        if: steps.install.outcome == 'success' && steps.prisma.outcome == 'success'
        continue-on-error: true
        run: npm run build >> build.log 2>&1
      - name: Comment diagnostic
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log') ? fs.readFileSync('build.log','utf8') : 'No build.log generated.';
            const tail = log.slice(-12000);
            const body = '### Admin build diagnostic\n\nInstall: **' + process.env.INSTALL + '** · Prisma: **' + process.env.PRISMA + '** · Build: **' + process.env.BUILD + '**\n\n```text\n' + tail + '\n```';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
        env:
          INSTALL: ${{ steps.install.outcome }}
          PRISMA: ${{ steps.prisma.outcome }}
          BUILD: ${{ steps.nextbuild.outcome }}
      - name: Enforce result
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.prisma.outcome }}" = "success"
          test "${{ steps.nextbuild.outcome }}" = "success"
